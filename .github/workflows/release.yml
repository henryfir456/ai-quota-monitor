name: Windows portable prerelease

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: The reviewed prerelease tag to create after all Windows gates pass.
        required: true
        type: choice
        options:
          - v0.1.2

permissions:
  contents: read

concurrency:
  group: windows-release-v0.1.2
  cancel-in-progress: false

jobs:
  build-and-package:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      unit_test_summary: ${{ steps.test-summary.outputs.summary }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag and application version
        shell: pwsh
        env:
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $expectedTag = 'v0.1.2'
          if ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch' -or $env:GITHUB_REF_NAME -ne 'main') { throw 'Prerelease requires a manual dispatch from main.' }
          if ($env:DISPATCH_RELEASE_TAG -ne $expectedTag) { throw 'Manual release tag must be v0.1.2.' }
          $existingTag = @(git ls-remote --tags origin "refs/tags/$expectedTag" "refs/tags/$expectedTag^{}")
          if ($LASTEXITCODE -ne 0) { throw 'Could not check whether the v0.1.2 tag already exists.' }
          if ($existingTag.Count -gt 0) {
            $records = @($existingTag | ForEach-Object { $parts = $_ -split '\s+'; [pscustomobject]@{ Sha = $parts[0]; Ref = $parts[1] } })
            $resolvedTagSha = [string](($records | Where-Object Ref -eq "refs/tags/$expectedTag^{}" | Select-Object -First 1).Sha)
            if (-not $resolvedTagSha) { $resolvedTagSha = [string](($records | Where-Object Ref -eq "refs/tags/$expectedTag" | Select-Object -First 1).Sha) }
            if ($resolvedTagSha -ne $env:GITHUB_SHA) { throw 'Existing v0.1.2 tag points to another source SHA; refusing reuse.' }
            Write-Output 'Existing v0.1.2 tag matches this exact source SHA and may resume an interrupted release.'
          }
          $tagCommit = (git rev-parse HEAD).Trim()
          if ($tagCommit -ne $env:GITHUB_SHA) { throw 'Checked out source SHA differs from release tag SHA.' }
          $mainCommit = (git rev-parse refs/remotes/origin/main).Trim()
          git merge-base --is-ancestor $tagCommit $mainCommit
          if ($LASTEXITCODE -ne 0) { throw 'Release tag must point to a commit already contained in origin/main.' }
          [xml]$project = Get-Content -LiteralPath 'src/AiQuotaMonitor.App/AiQuotaMonitor.App.csproj'
          if ($project.Project.PropertyGroup.Version -ne '0.1.2') { throw 'Application version and release tag differ.' }
          Write-Output "Verified release source SHA: $tagCommit"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore AiQuotaMonitor.sln
      - name: Build Release
        run: dotnet build AiQuotaMonitor.sln -c Release --no-restore
      - name: Test Release
        run: dotnet test AiQuotaMonitor.sln -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory tests/AiQuotaMonitor.Tests/TestResults
      - name: Summarize Windows unit tests
        id: test-summary
        shell: pwsh
        run: |
          [xml]$trx = Get-Content -LiteralPath 'tests/AiQuotaMonitor.Tests/TestResults/tests.trx' -Raw
          $counters = $trx.SelectSingleNode("//*[local-name()='Counters']")
          if ($null -eq $counters -or [int]$counters.failed -ne 0 -or [int]$counters.notExecuted -ne 0) { throw 'Windows unit test report is incomplete or contains failures.' }
          $summary = "total=$($counters.total); passed=$($counters.passed); failed=$($counters.failed); notExecuted=$($counters.notExecuted)"
          "summary=$summary" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output $summary
      - name: Test Claude helper parser and synthetic input
        shell: powershell
        run: ./tests/scripts/Test-ClaudeStatusline.ps1
      - name: Parse Windows PowerShell scripts
        shell: powershell
        run: |
          $errors = @()
          Get-ChildItem tests/scripts/*.ps1 -File | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            $errors += $parseErrors
          }
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; throw 'PowerShell script parser failed.' }
      - name: List dependency audit
        run: dotnet list AiQuotaMonitor.sln package --vulnerable --include-transitive
      - name: Publish self-contained single-file Windows x64 app
        run: >-
          dotnet publish src/AiQuotaMonitor.App/AiQuotaMonitor.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -p:DebugType=None -p:DebugSymbols=false
          -o artifacts/publish
      - name: Package final Windows executable
        shell: pwsh
        env:
          APP_VERSION: 0.1.2
        run: |
          $dependencyReport = Join-Path $env:RUNNER_TEMP 'AiQuotaMonitor-dependencies.txt'
          $appPackages = dotnet list src/AiQuotaMonitor.App/AiQuotaMonitor.App.csproj package --include-transitive
          $testPackages = dotnet list tests/AiQuotaMonitor.Tests/AiQuotaMonitor.Tests.csproj package --include-transitive
          @('PUBLISHED APP DEPENDENCIES', $appPackages, 'BUILD AND TEST DEPENDENCIES', $testPackages) | Set-Content -LiteralPath $dependencyReport -Encoding utf8
          $workflowUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ./tests/scripts/New-ReleaseArtifacts.ps1 `
            -Version $env:APP_VERSION `
            -Commit $env:GITHUB_SHA `
            -DotnetVersion (dotnet --version) `
            -PublishDirectory (Join-Path $PWD 'artifacts/publish') `
            -DependencyReportPath $dependencyReport `
            -WorkflowRunUrl $workflowUrl `
            -OutputDirectory (Join-Path $PWD 'artifacts/release')
      - name: Upload unverified package for Windows smoke gate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-package-candidate
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 1

  smoke-and-verify:
    needs: build-and-package
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Download exact package created by build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release-package-candidate
          path: artifacts/release
      - name: Smoke test final packaged EXE and deliberate failure control
        shell: pwsh
        env:
          APP_VERSION: 0.1.2
        run: |
          $workflowUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ./tests/scripts/Test-WindowsExecutableSmoke.ps1 `
            -ExecutablePath "artifacts/release/AiQuotaMonitor-$($env:APP_VERSION)-win-x64.exe" `
            -PackagePath "artifacts/release/AiQuotaMonitor-$($env:APP_VERSION)-win-x64-portable.zip" `
            -EvidencePath artifacts/smoke/windows-smoke-evidence.json `
            -SourceCommit $env:GITHUB_SHA -WorkflowRunUrl $workflowUrl `
            -StartupTimeoutSeconds 45 -StabilitySeconds 5 -VerifyNegativeControl
      - name: Verify tested package identity and SHA-256, then prepare release assets
        shell: pwsh
        env:
          APP_VERSION: 0.1.2
          UNIT_TEST_SUMMARY: ${{ needs.build-and-package.outputs.unit_test_summary }}
        run: |
          $workflowUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ./tests/scripts/Complete-ReleaseArtifacts.ps1 `
            -Version $env:APP_VERSION `
            -Commit $env:GITHUB_SHA `
            -UnitTestSummary $env:UNIT_TEST_SUMMARY `
            -SmokeEvidencePath artifacts/smoke/windows-smoke-evidence.json `
            -WorkflowRunUrl $workflowUrl `
            -OutputDirectory artifacts/release
      - name: Upload Windows verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-verified-release-assets
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 1

  publish-prerelease:
    needs: smoke-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download only smoke-verified Windows release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-verified-release-assets
          path: artifacts/release
      - name: Recheck PASS evidence and every SHA-256 before Release
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, sys
          root = pathlib.Path('artifacts/release')
          evidence = json.loads((root / 'WINDOWS_SMOKE_EVIDENCE.json').read_text(encoding='utf-8-sig'))
          if evidence.get('Outcome') != 'PASS':
              raise SystemExit('Windows smoke result is not PASS.')
          if evidence.get('SourceCommit') != os.environ['EXPECTED_SHA']:
              raise SystemExit('Windows smoke evidence source SHA differs from the release tag.')
          if evidence.get('WorkflowRunUrl') != os.environ['EXPECTED_RUN_URL']:
              raise SystemExit('Windows smoke evidence does not link the current Actions run.')
          if evidence.get('PositiveStartup', {}).get('GateResult') != 'PASS':
              raise SystemExit('Positive GUI startup evidence is missing.')
          if evidence.get('NegativeControl', {}).get('GateResult') != 'REJECTED_AS_EXPECTED':
              raise SystemExit('Negative startup-failure control is missing.')
          lines = (root / 'SHA256SUMS.txt').read_text(encoding='ascii').splitlines()
          expected = {}
          for line in lines:
              match = re.fullmatch(r'([0-9a-f]{64})  ([A-Za-z0-9._-]+)', line)
              if not match:
                  raise SystemExit('Malformed SHA256SUMS.txt entry.')
              expected[match.group(2)] = match.group(1)
          required = {
              'AiQuotaMonitor-0.1.2-win-x64.exe',
              'AiQuotaMonitor-0.1.2-win-x64-portable.zip',
              'TEST_REPORT.txt',
              'WINDOWS_SMOKE_EVIDENCE.json',
          }
          if not required.issubset(expected):
              raise SystemExit('Required release assets are missing from SHA256SUMS.txt.')
          for name, digest in expected.items():
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f'SHA-256 verification failed for {name}.')
          exe_hash = expected['AiQuotaMonitor-0.1.2-win-x64.exe']
          zip_hash = expected['AiQuotaMonitor-0.1.2-win-x64-portable.zip']
          if exe_hash != evidence.get('ExecutableSha256') or zip_hash != evidence.get('PackageSha256'):
              raise SystemExit('Release assets differ from the exact EXE/ZIP tested on Windows.')
          print(f'Windows smoke PASS; verified EXE SHA-256 {exe_hash}; verified ZIP SHA-256 {zip_hash}.')
          PY
      - name: Create exact source tag and GitHub prerelease after every gate passes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.2
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" || "$GITHUB_REF_NAME" != "main" || "$RELEASE_TAG" != "v0.1.2" ]]; then
            echo 'Release must be v0.1.2 from a manual dispatch on main.' >&2
            exit 1
          fi
          api_base="${GITHUB_API_URL:-https://api.github.com}/repos/$GITHUB_REPOSITORY"
          auth_header="Authorization: Bearer $GH_TOKEN"
          tag_status="$(curl --silent --show-error --output "$RUNNER_TEMP/release-tag.json" --write-out '%{http_code}' \
            --header "$auth_header" --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' "$api_base/git/ref/tags/$RELEASE_TAG")"
          resolve_tag_commit() {
            local response object_type object_sha attempt
            response="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
            object_type="$(jq -r '.object.type' <<< "$response")"
            object_sha="$(jq -r '.object.sha' <<< "$response")"
            for attempt in 1 2 3 4 5; do
              if [[ "$object_type" == "commit" ]]; then
                printf '%s' "$object_sha"
                return 0
              fi
              if [[ "$object_type" != "tag" ]]; then return 1; fi
              response="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
              object_type="$(jq -r '.object.type' <<< "$response")"
              object_sha="$(jq -r '.object.sha' <<< "$response")"
            done
            return 1
          }
          tag_present=false
          case "$tag_status" in
            404) ;;
            200)
              tag_present=true
              existing_tag_sha="$(resolve_tag_commit)" || { echo 'Could not resolve the existing release tag.' >&2; exit 1; }
              if [[ "$existing_tag_sha" != "$EXPECTED_SHA" ]]; then
                echo 'Existing v0.1.2 tag points to another source SHA.' >&2
                exit 1
              fi
              echo 'Existing v0.1.2 tag matches the exact tested source SHA; continuing an interrupted release.'
              ;;
            *) echo "Could not establish whether v0.1.2 tag exists (HTTP $tag_status)." >&2; exit 1 ;;
          esac
          if [[ "$tag_present" == false ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" \
              -f "sha=$EXPECTED_SHA" >/dev/null
          fi
          actual_tag_sha="$(resolve_tag_commit)"
          if [[ "$actual_tag_sha" != "$EXPECTED_SHA" ]]; then
            echo 'Release tag does not point to the exact Windows-tested source commit.' >&2
            exit 1
          fi
          printf 'Verified release tag %s at tested source %s\n' "$RELEASE_TAG" "$EXPECTED_SHA"
          manifest_path=artifacts/release/SHA256SUMS.txt
          manifest_sha="$(sha256sum "$manifest_path" | awk '{print $1}')"
          notes_file="$RUNNER_TEMP/v0.1.2-release-notes.md"
          {
            cat artifacts/release/RELEASE_NOTES.md
            printf '\n\n---\nRelease source SHA: `%s`\nArtifact manifest SHA-256: `%s`\n' "$EXPECTED_SHA" "$manifest_sha"
          } > "$notes_file"

          release_status="$(curl --silent --show-error --output "$RUNNER_TEMP/release.json" --write-out '%{http_code}' \
            --header "$auth_header" --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' "$api_base/releases/tags/$RELEASE_TAG")"
          case "$release_status" in
            404)
              gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
                --title 'AI Quota Monitor v0.1.2 (Windows x64)' \
                --notes-file "$notes_file"
              release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
              ;;
            200)
              release_json="$(cat "$RUNNER_TEMP/release.json")"
              if [[ "$(jq -r '.draft' <<< "$release_json")" != true ]]; then
                echo 'A published v0.1.2 Release already exists; refusing to alter it.' >&2
                exit 1
              fi
              release_body="$(jq -r '.body // ""' <<< "$release_json")"
              grep -Fqx "Release source SHA: \`$EXPECTED_SHA\`" <<< "$release_body" || {
                echo 'Existing draft source SHA does not match this tested run.' >&2; exit 1;
              }
              grep -Fqx "Artifact manifest SHA-256: \`$manifest_sha\`" <<< "$release_body" || {
                echo 'Existing draft artifact manifest differs from this exact package.' >&2; exit 1;
              }
              ;;
            *) echo "Could not establish v0.1.2 Release state (HTTP $release_status)." >&2; exit 1 ;;
          esac

          release_id="$(jq -r '.id' <<< "$release_json")"
          if [[ -z "$release_id" || "$release_id" == null || "$(jq -r '.draft' <<< "$release_json")" != true ]]; then
            echo 'Could not verify a draft v0.1.2 Release.' >&2
            exit 1
          fi
          if [[ "$(jq -r '.tag_name' <<< "$release_json")" != "$RELEASE_TAG" ]]; then
            echo 'Draft Release tag name differs from the verified source tag.' >&2
            exit 1
          fi
          release_body="$(jq -r '.body // ""' <<< "$release_json")"
          grep -Fqx "Release source SHA: \`$EXPECTED_SHA\`" <<< "$release_body" || {
            echo 'Draft release metadata does not match the tested source SHA.' >&2; exit 1;
          }
          grep -Fqx "Artifact manifest SHA-256: \`$manifest_sha\`" <<< "$release_body" || {
            echo 'Draft release metadata does not match the exact asset manifest.' >&2; exit 1;
          }

          mapfile -t expected_names < <(python3 - "$manifest_path" <<'PY'
          import pathlib, re, sys
          lines = pathlib.Path(sys.argv[1]).read_text(encoding='ascii').splitlines()
          names = []
          for line in lines:
              match = re.fullmatch(r'[0-9a-f]{64}  ([A-Za-z0-9._-]+)', line)
              if not match:
                  raise SystemExit('Malformed SHA256SUMS.txt entry.')
              names.append(match.group(1))
          if not names or len(names) != len(set(names)):
              raise SystemExit('SHA256SUMS.txt is empty or contains duplicate asset names.')
          print('\n'.join(names))
          PY
          )
          # The manifest cannot list its own digest; bind it through draft metadata and verify it separately.
          expected_names+=("SHA256SUMS.txt")
          expected_json="$(printf '%s\n' "${expected_names[@]}" | jq -R . | jq -s .)"
          remote_dir="$RUNNER_TEMP/v0.1.2-remote-assets"
          mkdir -p "$remote_dir"
          list_release_assets() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" | jq -s 'add // []'
          }
          verify_remote_names() {
            local assets_json="$1"
            jq -e --argjson expected "$expected_json" '
              ([.[].name] | length == (unique | length)) and
              ([.[].name] | all(. as $name | $expected | index($name) != null))
            ' <<< "$assets_json" >/dev/null || {
              echo 'Draft contains duplicate or unexpected assets.' >&2; exit 1;
            }
          }

          assets_json="$(list_release_assets)"
          verify_remote_names "$assets_json"
          for name in "${expected_names[@]}"; do
            local_path="artifacts/release/$name"
            if [[ ! -f "$local_path" ]]; then echo "Verified Windows artifact is missing: $name" >&2; exit 1; fi
            remote_present="$(jq -r --arg name "$name" '[.[] | select(.name == $name)] | length' <<< "$assets_json")"
            if [[ "$remote_present" == 0 ]]; then
              gh release upload "$RELEASE_TAG" "$local_path"
            else
              asset_state="$(jq -r --arg name "$name" '[.[] | select(.name == $name)][0].state // "unknown"' <<< "$assets_json")"
              if [[ "$asset_state" == starter ]]; then
                asset_id="$(jq -r --arg name "$name" '[.[] | select(.name == $name)][0].id // empty' <<< "$assets_json")"
                if [[ -z "$asset_id" ]]; then echo "Could not identify incomplete draft asset: $name" >&2; exit 1; fi
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" >/dev/null
                assets_json="$(list_release_assets)"
                remote_present="$(jq -r --arg name "$name" '[.[] | select(.name == $name)] | length' <<< "$assets_json")"
                if [[ "$remote_present" != 0 ]]; then echo "Incomplete draft asset could not be removed: $name" >&2; exit 1; fi
                gh release upload "$RELEASE_TAG" "$local_path"
              elif [[ "$asset_state" == uploaded ]]; then
                rm -f "$remote_dir/$name"
                gh release download "$RELEASE_TAG" --pattern "$name" --dir "$remote_dir"
                local_sha="$(sha256sum "$local_path" | awk '{print $1}')"
                remote_sha="$(sha256sum "$remote_dir/$name" | awk '{print $1}')"
                if [[ "$local_sha" != "$remote_sha" ]]; then
                  echo "Existing draft asset differs from this exact artifact: $name" >&2
                  exit 1
                fi
              else
                echo "Draft asset has an unrecognized upload state: $name" >&2
                exit 1
              fi
            fi
            assets_json="$(list_release_assets)"
            verify_remote_names "$assets_json"
          done

          remote_count="$(jq 'length' <<< "$assets_json")"
          if [[ "$remote_count" != "${#expected_names[@]}" ]]; then
            echo 'Draft does not contain exactly the verified Windows release assets.' >&2
            exit 1
          fi
          jq -e 'all(.[]; .state == "uploaded")' <<< "$assets_json" >/dev/null || {
            echo 'Draft contains an incomplete or unknown asset upload state.' >&2; exit 1;
          }
          for name in "${expected_names[@]}"; do
            rm -f "$remote_dir/$name"
            gh release download "$RELEASE_TAG" --pattern "$name" --dir "$remote_dir"
            local_sha="$(sha256sum "artifacts/release/$name" | awk '{print $1}')"
            remote_sha="$(sha256sum "$remote_dir/$name" | awk '{print $1}')"
            if [[ "$local_sha" != "$remote_sha" ]]; then
              echo "Final draft asset SHA-256 mismatch: $name" >&2
              exit 1
            fi
          done

          publish_tag_sha="$(resolve_tag_commit)" || { echo 'Could not re-resolve the release tag before publication.' >&2; exit 1; }
          if [[ "$publish_tag_sha" != "$EXPECTED_SHA" ]]; then
            echo 'Release tag changed after artifact verification; refusing publication.' >&2
            exit 1
          fi
          published_json="$(gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false -F prerelease=true)"
          if [[ "$(jq -r '.draft' <<< "$published_json")" != false || "$(jq -r '.prerelease' <<< "$published_json")" != true ]]; then
            echo 'GitHub did not confirm publication of the fully verified prerelease.' >&2
            exit 1
          fi
          printf 'Published fully verified v0.1.2 prerelease from %s with %s SHA-256-verified assets.\n' \
            "$EXPECTED_SHA" "$remote_count"
